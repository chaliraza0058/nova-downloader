
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Downloader</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:28px 15px}
h1{color:#39aaff;font-size:32px}
main{max-width:650px;margin:35px auto;padding:20px}
.panel{background:#111f32;padding:25px;border-radius:16px}
input{width:100%;padding:16px;border:1px solid #31516f;border-radius:9px;background:#07111f;color:white;font-size:15px}
button{width:100%;padding:15px;margin-top:15px;border:0;border-radius:9px;background:#168cff;color:white;font-weight:bold;font-size:16px}
#result{margin-top:20px;padding:15px;border-radius:9px;display:none;line-height:1.6}
.success{background:#123d35;color:#a7ffdc}
.error{background:#48252c;color:#ffc2c2}
.platforms{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}
.platforms span{background:#1c3048;padding:10px 13px;border-radius:8px;font-size:13px}
footer{text-align:center;color:#8195aa;padding:30px;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🚀 NOVA DOWNLOADER</h1>
<p>Smart Video Link Detection</p>
</header>
<main>
<div class="panel">
<h2>Download Your Video</h2>
<p>Paste your video link below</p>
<input id="videoUrl" type="url" placeholder="Paste video URL here...">
<button onclick="detectPlatform()">Analyze Video Link</button>
<div id="result"></div>
</div>
<h3>Supported Platforms</h3>
<div class="platforms">
<span>YouTube</span><span>Facebook</span>
<span>Instagram</span><span>TikTok</span>
<span>X / Twitter</span><span>Pinterest</span>
<span>Reddit</span><span>Other Direct Links</span>
</div>
</main>
<footer>Nova Downloader © 2026</footer>
<script>
function detectPlatform(){
 const input=document.getElementById("videoUrl").value.trim();
 const result=document.getElementById("result");
 result.style.display="block";
 result.className="";

 if(!input){
  result.className="error";
  result.innerText="Please paste a video link first.";
  return;
 }

 let url;
 try{
  url=new URL(input);
  if(!["http:","https:"].includes(url.protocol)) throw Error();
 }catch(e){
  result.className="error";
  result.innerText="Invalid link. Please enter a valid URL.";
  return;
 }

 const host=url.hostname.toLowerCase().replace(/^www\./,"");
 let platform="Other Website";

 if(host==="youtube.com"||host==="youtu.be"||host.endsWith(".youtube.com")) platform="YouTube";
 else if(host==="facebook.com"||host==="fb.watch"||host.endsWith(".facebook.com")) platform="Facebook";
 else if(host==="instagram.com"||host.endsWith(".instagram.com")) platform="Instagram";
 else if(host==="tiktok.com"||host.endsWith(".tiktok.com")) platform="TikTok";
 else if(host==="x.com"||host==="twitter.com"||host.endsWith(".twitter.com")) platform="X / Twitter";
 else if(host==="pinterest.com"||host==="pin.it"||host.endsWith(".pinterest.com")) platform="Pinterest";
 else if(host==="reddit.com"||host==="redd.it"||host.endsWith(".reddit.com")) platform="Reddit";

 result.className="success";
 result.innerHTML="<strong>Platform detected: "+platform+"</strong><br>Link received successfully!<br><small>Actual download support will be added through permitted methods in a later phase.</small>";
}
</script>
</body>
</html>
