
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Downloader</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:30px 15px}
h1{color:#39aaff;font-size:32px}
main{max-width:650px;margin:25px auto;padding:20px}
.panel{background:#111f32;padding:25px;border-radius:16px}
input{width:100%;padding:16px;border:1px solid #31516f;border-radius:9px;background:#07111f;color:white;font-size:15px}
button{width:100%;padding:15px;margin-top:15px;border:0;border-radius:9px;background:#168cff;color:white;font-weight:bold;font-size:16px}
button:disabled{opacity:.6}
#result{display:none;margin-top:20px;padding:15px;border-radius:9px;line-height:1.7;overflow-wrap:anywhere}
.success{background:#123d35;color:#a7ffdc}
.error{background:#48252c;color:#ffc2c2}
.platforms{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}
.platforms span{background:#1c3048;padding:10px 13px;border-radius:8px;font-size:13px}
footer{text-align:center;color:#8195aa;padding:30px;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🚀 NOVA DOWNLOADER</h1>
<p>Smart Video Link Detection</p>
</header>
<main>
<div class="panel">
<h2>Analyze Your Video Link</h2>
<p>Paste your video URL below</p>
<input id="videoUrl" type="url" placeholder="Paste video URL here...">
<button id="analyzeBtn" onclick="analyzeVideo()">Analyze Video Link</button>
<div id="result"></div>
</div>
<h3>Supported Platforms</h3>
<div class="platforms">
<span>YouTube</span><span>Facebook</span>
<span>Instagram</span><span>TikTok</span>
<span>X / Twitter</span><span>Pinterest</span>
<span>Reddit</span><span>Other Websites</span>
</div>
</main>
<footer>Nova Downloader © 2026</footer>
<script>
const API_URL = "https://nova-downloader.chaliraza0058.workers.dev";

async function analyzeVideo(){
 const input=document.getElementById("videoUrl");
 const result=document.getElementById("result");
 const button=document.getElementById("analyzeBtn");

 result.style.display="block";
 result.className="";
 result.textContent="Connecting to Nova backend...";
 button.disabled=true;

 try{
  const response=await fetch(API_URL+"/api/analyze",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({url:input.value.trim()})
  });

  const data=await response.json();

  if(!response.ok || !data.success){
   throw new Error(data.error || "Unable to analyze link");
  }

  result.className="success";
  result.innerHTML=
   "<strong>Platform detected: "+escapeHTML(data.platform)+"</strong><br>"+
   "Backend: Connected successfully<br>"+
   "Link: "+escapeHTML(data.originalUrl)+"<br>"+
   "<small>Video download is not available yet. Download integration will be added in a future phase.</small>";

 }catch(error){
  result.className="error";
  result.textContent="Error: "+error.message;
 }finally{
  button.disabled=false;
 }
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
 });
}
</script>
</body>
</html>
